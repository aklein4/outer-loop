# See docs/sharding.md for more details about sharding configuration.

# Replicate parameters unless explicitly sharded below. This keeps attention,
# embeddings, vocabulary projection, norms, and Forte-specific parameters local
# on every device while sharding only the largest standard MLP matrices.
replicate_default: true

# Main causal MLP matrices
model.layers.layers.*.mlp.gate_proj.weight: [fsdp, null]
model.layers.layers.*.mlp.up_proj.weight: [fsdp, null]
model.layers.layers.*.mlp.down_proj.weight: [fsdp, null]

# Activations
model.layers.layers.*: [[data, fsdp], null, null]
