advanced:

  - name: causal_layers
    settings:
      activation_checkpoint_layers:
        - SlitherCausalLayer
      optimization_barrier_layers:
        - SlitherCausalLayer
      scan_layers: layers
      is_layer_pure: true
      offload_tensors:
        - slither_causal_layer_input

  - name: noncausal_layers
    settings:
      activation_checkpoint_layers:
        - SlitherNonCausalLayer
      optimization_barrier_layers:
        - SlitherNonCausalLayer
      scan_layers: layers
      is_layer_pure: true
      offload_tensors:
        - slither_noncausal_layer_input
