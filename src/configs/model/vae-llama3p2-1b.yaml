defaults:
  - llama3p2-1b
  - override sharding: vae-fsdp
  - override remat: vae
  - _self_

type: vae.VAEModel

# The encoder uses the first N pretrained layers before a new non-causal head.
# The decoder is a distinct, complete copy of the pretrained causal backbone.
num_encoder_causal_layers: 10
num_noncausal_layers: 6
num_decoder_layers: ${.num_hidden_layers}

# One matrix is produced per independent sequence and read by every decoder MLP.
latent_size: 2048
num_latent_key_heads: 8
num_latent_value_heads: 64
init_mse_lambda: 0.1

# Independent per-sequence decoder signal scale, sampled uniformly in this range.
radius_min: 0.0
radius_max: 1.0
latent_rms_norm_eps: 1.0e-12

mixer_kernel_size: 5
pad_attention_bias_value: -1000.0
