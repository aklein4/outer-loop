defaults:
  - horizon-xl
  - _self_

global_batch_size: 256
num_logit_iterations: 4

type: fo_ittt_trainer.FoItttTrainer

# use multiple different optimizers for different parameters
multiple_optimizers:

  # weights related to the OLoop architecture
  fast:

    optimizer:
      type: muon.ScaledMuon

      kwargs:
        lr: 2.0e-4
        betas: [0.9, 0.95]
        eps: 1e-6
        weight_decay: 0.01

    lr_scheduler:
      type: warmup_stable_decay

      num_warmup_steps: 50
      kwargs:
        num_stable_steps: 1000000 # Currently never decays
        num_decay_steps: 2500
        min_lr_ratio: 0.0
        warmup_type: linear
        decay_type: linear

  # original transformer weights
  slow:

    optimizer:
      type: muon.ScaledMuon

      kwargs:
        lr: 2.0e-5
        betas: [0.9, 0.95]
        eps: 1e-6
        weight_decay: 0.01

    lr_scheduler:
      type: warmup_stable_decay

      num_warmup_steps: 50
      kwargs:
        num_stable_steps: 1000000 # Currently never decays
        num_decay_steps: 2500
        min_lr_ratio: 0.0
        warmup_type: linear
        decay_type: linear